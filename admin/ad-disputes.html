<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBG Admin — ad-disputes.html</title><style>
:root{--navy:#062b55;--blue:#0874a6;--green:#137a3d;--red:#b42318;--gold:#8a6100;--bg:#f4f8fb;--line:#d9e5ec;--muted:#667b8c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17324a}header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:20px}
.wrap{max-width:1080px;margin:20px auto;padding:0 14px}.card,.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 7px 22px #062b550b}
h2,h3{color:var(--navy)}input,textarea{width:100%;padding:12px;border:1px solid #cbdbe5;border-radius:10px;margin:6px 0 12px;font:inherit}
button{border:0;border-radius:999px;padding:11px 15px;margin:3px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer}.green{background:var(--green)}.red{background:var(--red)}.secondary{background:#eaf3f7;color:var(--navy)}
.hidden{display:none}.msg{padding:12px;border-radius:10px;background:#edf6f8;margin:12px 0;white-space:pre-wrap}.ok{background:#e8f8ed;color:#176b38}.err{background:#ffe9e9;color:#8a2020}.warn{background:#fff5dc;color:#765300}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.muted{font-size:13px;color:var(--muted)}.pill{padding:6px 10px;border-radius:999px;background:#eef4f7;font-size:12px;font-weight:bold}
.pending{background:#fff2c7;color:#765300}.verified{background:#e4f7e9;color:#176b38}.rejected{background:#ffe6e6;color:#8a2020}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}.stat{background:#f7fafc;border-radius:11px;padding:11px}.stat b{display:block;margin-top:4px}
.paygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.paybox{background:#f7fafc;border-radius:10px;padding:10px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.product{border:1px solid var(--line);border-radius:11px;padding:9px}.product img{width:100%;height:95px;object-fit:cover;border-radius:8px}
.identity-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.identity-note{font-size:13px;color:var(--muted);margin-top:7px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}}@media(max-width:430px){.products,.paygrid{grid-template-columns:1fr}}

.wholesale-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.wholesale-item{border-left:4px solid #0874a6}.wholesale-note{margin-top:10px}</style></head><body><header><div class="wrap" style="margin:0 auto;padding:0"><b style="font-size:22px">Maldives Business Gateway</b><div>Secure Administration</div></div></header><main class="wrap"><section id="loginBox" class="card"><h2>Administrator Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Admin Login</button><div id="loginMsg" class="msg">Ready.</div></section><section id="dash" class="hidden"><div class="card"><div class="top"><div><h2 style="margin:0">MBG Admin Dashboard</h2><div id="who" class="muted"></div></div><button id="logout" class="secondary">Logout</button></div><div id="msg" class="msg">Ready.</div></div><nav class="card" style="display:flex;flex-wrap:wrap;gap:8px"><a href="ad-admin.html" style="padding:10px;background:#eaf3f7;border-radius:9px;color:#062b55;text-decoration:none;font-weight:bold">🏠 Dashboard</a><a href="ad-businesses.html" style="padding:10px;background:#eaf3f7;border-radius:9px;color:#062b55;text-decoration:none;font-weight:bold">🏢 Businesses</a><a href="ad-identity.html" style="padding:10px;background:#eaf3f7;border-radius:9px;color:#062b55;text-decoration:none;font-weight:bold">🪪 Identity</a><a href="ad-payments.html" style="padding:10px;background:#eaf3f7;border-radius:9px;color:#062b55;text-decoration:none;font-weight:bold">💳 Payments</a><a href="ad-disputes.html" style="padding:10px;background:#eaf3f7;border-radius:9px;color:#062b55;text-decoration:none;font-weight:bold">🚨 Disputes</a><a href="ad-wholesale.html" style="padding:10px;background:#eaf3f7;border-radius:9px;color:#062b55;text-decoration:none;font-weight:bold">📦 Wholesale</a><a href="ad-recovery.html" style="padding:10px;background:#eaf3f7;border-radius:9px;color:#062b55;text-decoration:none;font-weight:bold">🔐 Recovery</a></nav><div class="card"><div class="top"><div><h2 style="margin:0">🚨 Dispute Investigation Center</h2><div class="muted">Review buyer complaints, seller responses and start a 15-day resolution period.</div></div><button class="secondary" id="refreshDisputes">Refresh</button></div><div id="disputes" style="margin-top:14px"></div></div></section></main><script type="module">const URL='https://ehavxdqegpoggrkoxypm.supabase.co',KEY='sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,user,businessMap={};
function message(id,t,c=''){let e=$(id);if(!e)return;e.textContent=t;e.className='msg '+c}
function dt(v){return v?new Date(v).toLocaleString():'—'} function d(v){return v?new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—'}
async function loadBusinessMap(){const {data,error}=await sb.from('businesses').select('*');if(error){message('msg','Business information: '+error.message,'err');return}businessMap=Object.fromEntries((data||[]).map(b=>[b.id,b]))}
function sellerBusiness(sellerId){return Object.values(businessMap).find(b=>String(b.owner_id)===String(sellerId))||{}}
async function enter(session){user=session?.user;if(!user){$('loginBox').classList.remove('hidden');$('dash').classList.add('hidden');return}const {data,error}=await sb.from('mbg_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await sb.auth.signOut();message('loginMsg','Access denied. This account is not an MBG administrator.','err');return}$('loginBox').classList.add('hidden');$('dash').classList.remove('hidden');$('who').textContent=user.email;await loadAll()}


function disputeLabel(st){return ({open:'AWAITING SELLER RESPONSE',seller_responded:'SELLER RESPONDED',under_review:'15-DAY RESOLUTION',refund_required:'REFUND REQUIRED',refund_submitted:'REFUND SUBMITTED',resolved:'RESOLVED',rejected:'CLOSED / NOT UPHELD',refund_overdue:'REFUND OVERDUE'})[st]||String(st||'').toUpperCase()}

async function loadDisputes(){
 const {data,error}=await sb.from('order_disputes').select('*').order('opened_at',{ascending:false});
 if(error){$('disputes').innerHTML=`<div class="msg err">Could not load disputes: ${esc(error.message)}</div>`;return}
 const rows=data||[];
 if(!rows.length){$('disputes').innerHTML='<div class="msg">No disputes yet.</div>';return}
 $('disputes').innerHTML=rows.map(d=>{
  const b=businessMap[d.business_id]||{};
  return `<div class="item" style="${['open','seller_responded','under_review','refund_required','refund_overdue'].includes(d.status)?'border:2px solid #d79b32':''}">
   <div class="top"><div><h3 style="margin:0">🚨 ${esc(b.name||'Business')} — Dispute</h3><div class="muted">Dispute ${esc(d.id)} • Order ${esc(d.order_id)} • Opened ${dt(d.opened_at)}</div></div><span class="pill">${esc(disputeLabel(d.status))}</span></div>
   <div class="paygrid"><div class="paybox">Buyer<b>${esc(d.customer_name)}</b></div><div class="paybox">Phone<b>${esc(d.customer_phone)}</b></div><div class="paybox">Reason<b>${esc(d.reason)}</b></div><div class="paybox">Deadline<b>${d.refund_deadline?dt(d.refund_deadline):'Not set'}</b></div></div>
   <div class="msg"><b>Buyer statement</b><br>${esc(d.buyer_statement)}</div>
   <div class="msg"><b>Seller response</b><br>${d.seller_response?esc(d.seller_response):'<span class="muted">Waiting for seller response.</span>'}</div>
   ${d.admin_note?`<div class="msg"><b>MBG note</b><br>${esc(d.admin_note)}</div>`:''}
   ${d.status==='seller_responded'?`<button class="green" data-review="${d.id}">Start 15-Day Resolution Period</button><button class="secondary" data-close="${d.id}">Close Dispute</button>`:''}
   ${d.status==='open'?`<div class="msg warn">Waiting for the seller to respond before MBG starts the resolution period.</div>`:''}
   ${d.status==='under_review'?`<div class="msg warn"><b>Resolution period active.</b> If the item arrives, the buyer should confirm receipt. If it remains unresolved, MBG can decide whether a refund is required.</div><button class="red" data-refund="${d.id}">Require Refund</button><button class="secondary" data-close="${d.id}">Resolve / Close</button>`:''}
   ${d.status==='refund_required'?`<div class="msg warn"><b>Seller must refund.</b> Amount: ${d.refund_amount!=null?'MVR '+Number(d.refund_amount).toFixed(2):'See decision'} • Deadline: ${d.refund_deadline?dt(d.refund_deadline):'—'}</div>`:''}
  </div>`
 }).join('');
 document.querySelectorAll('[data-review]').forEach(x=>x.onclick=()=>startResolution(x.dataset.review));
 document.querySelectorAll('[data-refund]').forEach(x=>x.onclick=()=>requireRefund(x.dataset.refund));
 document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>closeDispute(x.dataset.close));
}

async function startResolution(id){
 const note=prompt('MBG review note (optional):')??'';
 if(!confirm('Start the 15-day resolution period? During this time the buyer can confirm if the item arrives.'))return;
 const {error}=await sb.rpc('mbg_admin_start_resolution',{target_dispute:id,admin_message:note||null});
 if(error)return message('msg','Could not start resolution period: '+error.message,'err');
 message('msg','15-day resolution period started.','ok');await loadDisputes()
}

async function requireRefund(id){
 const amount=prompt('Refund amount in MVR:');
 if(amount===null)return;
 const n=Number(amount);if(!Number.isFinite(n)||n<0)return alert('Enter a valid refund amount.');
 const note=prompt('MBG refund decision / instruction:')??'';
 if(!confirm('Require the seller to refund MVR '+n.toFixed(2)+'?'))return;
 const {error}=await sb.rpc('mbg_admin_require_refund',{target_dispute:id,refund_amount_input:n,admin_message:note||null});
 if(error)return message('msg','Refund decision failed: '+error.message,'err');
 message('msg','Refund requirement recorded.','ok');await loadDisputes()
}

async function closeDispute(id){
 const note=prompt('Reason / MBG resolution note:');
 if(note===null||note.trim().length<3)return;
 if(!confirm('Close this dispute as resolved?'))return;
 const {error}=await sb.rpc('mbg_admin_close_dispute',{target_dispute:id,admin_message:note.trim()});
 if(error)return message('msg','Could not close dispute: '+error.message,'err');
 message('msg','Dispute closed.','ok');await loadDisputes()
}
async function loadAll(){await loadBusinessMap();await loadDisputes();}
const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(URL,KEY);
$('login').onclick=async()=>{message('loginMsg','Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)message('loginMsg','Login failed: '+error.message,'err')};
$('logout').onclick=()=>sb.auth.signOut();
$('refreshDisputes').onclick=loadDisputes;
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>enter(s),0));const {data:{session}}=await sb.auth.getSession();await enter(session);if(!session)message('loginMsg','Ready for secure administrator login.','ok');</script></body></html>
