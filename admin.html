<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBG Admin Dashboard</title>
<style>
:root{--navy:#062b55;--blue:#0874a6;--green:#137a3d;--red:#b42318;--gold:#8a6100;--bg:#f4f8fb;--line:#d9e5ec;--muted:#667b8c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17324a}header{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:20px}
.wrap{max-width:1050px;margin:20px auto;padding:0 14px}.card,.biz{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 7px 22px #062b550b}
h2,h3{color:var(--navy)}input{width:100%;padding:12px;border:1px solid #cbdbe5;border-radius:10px;margin:6px 0 12px}
button{border:0;border-radius:999px;padding:11px 15px;margin:3px;background:var(--blue);color:white;font-weight:bold;cursor:pointer}.approve,.upgrade{background:var(--green)}.reject{background:var(--red)}.secondary{background:#eaf3f7;color:var(--navy)}
.hidden{display:none}.msg{padding:12px;border-radius:10px;background:#edf6f8;margin:12px 0;white-space:pre-wrap}.ok{background:#e8f8ed;color:#176b38}.err{background:#ffe9e9;color:#8a2020}.warn{background:#fff5dc;color:#765300}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.muted{font-size:13px;color:var(--muted)}.pill{padding:6px 10px;border-radius:999px;background:#eef4f7;font-size:12px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}.stat{background:#f7fafc;border-radius:11px;padding:11px}.stat b{display:block;margin-top:4px}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.product{border:1px solid var(--line);border-radius:11px;padding:9px}.product img{width:100%;height:95px;object-fit:cover;border-radius:8px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}}@media(max-width:430px){.products{grid-template-columns:1fr}}
</style></head>
<body><header><div class="wrap" style="margin:0 auto;padding:0"><b style="font-size:22px">Maldives Business Gateway</b><div>Secure Administration • Plans & Business Approval</div></div></header>
<main class="wrap">
<section id="loginBox" class="card"><h2>Administrator Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="login">Admin Login</button><div id="loginMsg" class="msg">Connecting…</div></section>
<section id="dash" class="hidden">
<div class="card"><div class="top"><div><h2 style="margin:0">MBG Admin Dashboard</h2><div id="who" class="muted"></div></div><button id="logout" class="secondary">Logout</button></div><div id="msg" class="msg">Ready.</div></div>
<div class="card"><div class="top"><h2 style="margin:0">Businesses</h2><button id="refresh" class="secondary">Refresh</button></div><div id="list"></div></div>
</section></main>
<script type="module">
const URL='https://ehavxdqegpoggrkoxypm.supabase.co',KEY='sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,user;
function message(id,t,c=''){let e=$(id);e.textContent=t;e.className='msg '+c}
function date(v){return v?new Date(v).toLocaleDateString():'—'}
async function enter(session){
 user=session?.user;
 if(!user){$('loginBox').classList.remove('hidden');$('dash').classList.add('hidden');return}
 const {data,error}=await sb.from('mbg_admins').select('user_id').eq('user_id',user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();message('loginMsg','Access denied. This account is not an MBG administrator.','err');return}
 $('loginBox').classList.add('hidden');$('dash').classList.remove('hidden');$('who').textContent=user.email;await load()
}
async function load(){
 message('msg','Loading MBG businesses…');
 const {data,error}=await sb.from('businesses').select('*').order('created_at',{ascending:false});
 if(error)return message('msg','Load failed: '+error.message,'err');
 $('list').innerHTML='';
 for(const b of data||[]){
  const {data:ps}=await sb.from('products').select('*').eq('business_id',b.id);
  const count=(ps||[]).length, plan=(b.plan||'free').toUpperCase(), limit=b.product_limit??10;
  let el=document.createElement('div');el.className='biz';
  el.innerHTML=`<div class="top"><div><h3 style="margin:0 0 4px">${esc(b.name)}</h3><div class="muted">${esc(b.category||'')} ${b.location?'• '+esc(b.location):''}</div></div><span class="pill">${esc((b.status||'pending').toUpperCase())}</span></div>
  <div class="stats"><div class="stat">Plan<b>${esc(plan)}</b></div><div class="stat">Products<b>${count} / ${limit}</b></div><div class="stat">Subscription<b>${esc((b.subscription_status||'free').toUpperCase())}</b></div><div class="stat">Expires<b>${date(b.subscription_expires_at)}</b></div></div>
  <p>${esc(b.description||'')}</p><div class="muted"><b>Slug:</b> ${esc(b.slug)} &nbsp; <b>Phone:</b> ${esc(b.phone||'—')}</div>
  <h4>Products (${count})</h4><div class="products">${(ps||[]).map(p=>`<div class="product">${p.image_url?`<img src="${esc(p.image_url)}">`:''}<b>${esc(p.title)}</b><div>${p.price!=null?'MVR '+Number(p.price).toFixed(2):''}</div></div>`).join('')||'<span class="muted">No products</span>'}</div>
  <div style="margin-top:14px"><button class="approve" data-action="status" data-id="${b.id}" data-value="approved">Approve Business</button><button class="reject" data-action="status" data-id="${b.id}" data-value="rejected">Reject</button><button class="secondary" data-action="status" data-id="${b.id}" data-value="pending">Pending</button>${plan==='FREE'?`<button class="upgrade" data-action="upgrade" data-id="${b.id}">Activate Business — $5/month</button>`:''}</div>`;
  $('list').appendChild(el)
 }
 document.querySelectorAll('[data-action="status"]').forEach(x=>x.onclick=()=>status(x.dataset.id,x.dataset.value));
 document.querySelectorAll('[data-action="upgrade"]').forEach(x=>x.onclick=()=>upgrade(x.dataset.id));
 message('msg',`Loaded ${(data||[]).length} business(es).`,'ok')
}
async function status(id,s){
 if(!confirm('Change business status to '+s+'?'))return;
 const {error}=await sb.from('businesses').update({status:s}).eq('id',id);
 if(error)return message('msg','Update failed: '+error.message,'err');message('msg','Business status changed to '+s+'.','ok');await load()
}
async function upgrade(id){
 if(!confirm('Confirm payment received and activate MBG Business plan for $5/month?'))return;
 message('msg','Activating MBG Business plan…');
 const {error}=await sb.rpc('mbg_activate_business_plan',{target_business:id});
 if(error)return message('msg','Upgrade failed: '+error.message,'err');
 message('msg','MBG Business activated: up to 100 products for one month.','ok');await load()
}
const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(URL,KEY);
$('login').onclick=async()=>{message('loginMsg','Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)message('loginMsg','Login failed: '+error.message,'err')};
$('logout').onclick=()=>sb.auth.signOut();$('refresh').onclick=load;sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>enter(s),0));const {data:{session}}=await sb.auth.getSession();await enter(session);if(!session)message('loginMsg','Ready for secure administrator login.','ok');
</script></body></html>
