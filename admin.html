<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBG Admin Dashboard</title>
<style>
:root{--navy:#062b55;--blue:#0874a6;--green:#137a3d;--red:#b42318;--gold:#8a6100;--bg:#f4f8fb;--line:#d9e5ec;--muted:#667b8c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17324a}header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:20px}
.wrap{max-width:1080px;margin:20px auto;padding:0 14px}.card,.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 7px 22px #062b550b}
h2,h3{color:var(--navy)}input,textarea{width:100%;padding:12px;border:1px solid #cbdbe5;border-radius:10px;margin:6px 0 12px;font:inherit}
button{border:0;border-radius:999px;padding:11px 15px;margin:3px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer}.green{background:var(--green)}.red{background:var(--red)}.secondary{background:#eaf3f7;color:var(--navy)}
.hidden{display:none}.msg{padding:12px;border-radius:10px;background:#edf6f8;margin:12px 0;white-space:pre-wrap}.ok{background:#e8f8ed;color:#176b38}.err{background:#ffe9e9;color:#8a2020}.warn{background:#fff5dc;color:#765300}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.muted{font-size:13px;color:var(--muted)}.pill{padding:6px 10px;border-radius:999px;background:#eef4f7;font-size:12px;font-weight:bold}
.pending{background:#fff2c7;color:#765300}.verified{background:#e4f7e9;color:#176b38}.rejected{background:#ffe6e6;color:#8a2020}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}.stat{background:#f7fafc;border-radius:11px;padding:11px}.stat b{display:block;margin-top:4px}
.paygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.paybox{background:#f7fafc;border-radius:10px;padding:10px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.product{border:1px solid var(--line);border-radius:11px;padding:9px}.product img{width:100%;height:95px;object-fit:cover;border-radius:8px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}}@media(max-width:430px){.products,.paygrid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap" style="margin:0 auto;padding:0"><b style="font-size:22px">Maldives Business Gateway</b><div>Secure Administration • Payment Verification • Plans</div></div></header>
<main class="wrap">
<section id="loginBox" class="card"><h2>Administrator Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Admin Login</button><div id="loginMsg" class="msg">Ready.</div></section>
<section id="dash" class="hidden">
<div class="card"><div class="top"><div><h2 style="margin:0">MBG Admin Dashboard</h2><div id="who" class="muted"></div></div><button id="logout" class="secondary">Logout</button></div><div id="msg" class="msg">Ready.</div></div>

<div class="card"><div class="top"><div><h2 style="margin:0">💳 Payment Verification Center</h2><div class="muted">Verify the money in your actual bank/payment account before activation.</div></div><button id="refreshPayments" class="secondary">Refresh</button></div><div id="payments" style="margin-top:14px"></div></div>

<div class="card"><div class="top"><h2 style="margin:0">Businesses</h2><button id="refresh" class="secondary">Refresh</button></div><div id="businesses"></div></div>
</section></main>
<script type="module">
const URL='https://ehavxdqegpoggrkoxypm.supabase.co',KEY='sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,user,businessMap={};
function message(id,t,c=''){let e=$(id);e.textContent=t;e.className='msg '+c}
function dt(v){return v?new Date(v).toLocaleString():'—'} function d(v){return v?new Date(v).toLocaleDateString():'—'}

async function enter(session){
 user=session?.user;
 if(!user){$('loginBox').classList.remove('hidden');$('dash').classList.add('hidden');return}
 const {data,error}=await sb.from('mbg_admins').select('user_id').eq('user_id',user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();message('loginMsg','Access denied. This account is not an MBG administrator.','err');return}
 $('loginBox').classList.add('hidden');$('dash').classList.remove('hidden');$('who').textContent=user.email;
 await loadAll()
}
async function loadAll(){await loadBusinesses();await loadPayments()}

async function loadBusinesses(){
 const {data,error}=await sb.from('businesses').select('*').order('created_at',{ascending:false});
 if(error)return message('msg','Business load failed: '+error.message,'err');
 businessMap=Object.fromEntries((data||[]).map(b=>[b.id,b]));$('businesses').innerHTML='';
 for(const b of data||[]){
  const {data:ps}=await sb.from('products').select('*').eq('business_id',b.id);
  const count=(ps||[]).length,plan=(b.plan||'free').toUpperCase(),limit=b.product_limit??10;
  const el=document.createElement('div');el.className='item';
  el.innerHTML=`<div class="top"><div><h3 style="margin:0 0 4px">${esc(b.name)}</h3><div class="muted">${esc(b.category||'')} ${b.location?'• '+esc(b.location):''}</div></div><span class="pill">${esc((b.status||'pending').toUpperCase())}</span></div>
  <div class="stats"><div class="stat">Plan<b>${esc(plan)}</b></div><div class="stat">Products<b>${count} / ${limit}</b></div><div class="stat">Subscription<b>${esc((b.subscription_status||'free').toUpperCase())}</b></div><div class="stat">Expires<b>${d(b.subscription_expires_at)}</b></div></div>
  <p>${esc(b.description||'')}</p><div class="muted"><b>Phone:</b> ${esc(b.phone||'—')} &nbsp; <b>Slug:</b> ${esc(b.slug||'—')}</div>
  <h4>Products (${count})</h4><div class="products">${(ps||[]).map(p=>`<div class="product">${p.image_url?`<img src="${esc(p.image_url)}">`:''}<b>${esc(p.title)}</b><div>${p.price!=null?'MVR '+Number(p.price).toFixed(2):''}</div></div>`).join('')||'<span class="muted">No products</span>'}</div>
  <div style="margin-top:14px"><button class="green" data-status="${b.id}|approved">Approve Business</button><button class="red" data-status="${b.id}|rejected">Reject</button><button class="secondary" data-status="${b.id}|pending">Pending</button></div>`;
  $('businesses').appendChild(el)
 }
 document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>{let [id,s]=x.dataset.status.split('|');setStatus(id,s)});
 message('msg',`Loaded ${(data||[]).length} business(es).`,'ok')
}

async function loadPayments(){
 const {data,error}=await sb.from('payment_requests').select('*').order('created_at',{ascending:false});
 if(error){$('payments').innerHTML=`<div class="msg err">Could not load payment requests: ${esc(error.message)}</div>`;return}
 const rows=data||[];if(!rows.length){$('payments').innerHTML='<div class="msg">No payment requests yet.</div>';return}
 $('payments').innerHTML=rows.map(r=>{
   const b=businessMap[r.business_id]||{},st=(r.status||'pending').toLowerCase();
   return `<div class="item"><div class="top"><div><h3 style="margin:0">${esc(b.name||'Business')}</h3><div class="muted">Submitted ${dt(r.created_at)}</div></div><span class="pill ${st}">${esc(st.toUpperCase())}</span></div>
   <div class="paygrid"><div class="paybox">Plan<b style="display:block">MBG Business</b></div><div class="paybox">Amount<b style="display:block">$${Number(r.amount_usd||5).toFixed(2)}</b></div><div class="paybox">Method<b style="display:block">${esc(r.payment_method||'—')}</b></div><div class="paybox">Reference<b style="display:block">${esc(r.transaction_reference||'—')}</b></div></div>
   ${r.seller_note?`<p><b>Seller note:</b> ${esc(r.seller_note)}</p>`:''}${r.admin_note?`<p><b>Admin note:</b> ${esc(r.admin_note)}</p>`:''}
   ${st==='pending'?`<div class="msg warn"><b>Do not approve from the reference alone.</b> Check your actual bank/payment account and confirm the money was received.</div><button class="green" data-verify="${r.id}|${r.business_id}">✓ Payment Received — Verify & Activate</button><button class="red" data-reject="${r.id}">Reject Payment</button>`:`<div class="muted">${r.verified_at?'Processed: '+dt(r.verified_at):''}</div>`}</div>`
 }).join('');
 document.querySelectorAll('[data-verify]').forEach(x=>x.onclick=()=>{let [rid,bid]=x.dataset.verify.split('|');verifyPayment(rid,bid)});
 document.querySelectorAll('[data-reject]').forEach(x=>x.onclick=()=>rejectPayment(x.dataset.reject))
}

async function verifyPayment(requestId,businessId){
 if(!confirm('Have you checked your actual bank/payment account and confirmed the $5 payment was received?'))return;
 message('msg','Activating Business plan…');
 const {error:activateError}=await sb.rpc('mbg_activate_business_plan',{target_business:businessId});
 if(activateError)return message('msg','Activation failed: '+activateError.message,'err');
 const {error:updateError}=await sb.from('payment_requests').update({status:'verified',verified_at:new Date().toISOString(),admin_note:'Payment confirmed received by MBG Admin. Business plan activated.'}).eq('id',requestId).eq('status','pending');
 if(updateError)return message('msg','Plan activated, but payment record update failed: '+updateError.message+'. Please do not activate again; check Supabase.','err');
 message('msg','Payment verified. MBG Business activated for one month with up to 100 products.','ok');await loadAll()
}
async function rejectPayment(id){
 const note=prompt('Reason / admin note for rejection (optional):')??'';
 if(!confirm('Reject this payment request?'))return;
 const {error}=await sb.from('payment_requests').update({status:'rejected',verified_at:new Date().toISOString(),admin_note:note||'Payment not verified by MBG.'}).eq('id',id).eq('status','pending');
 if(error)return message('msg','Reject failed: '+error.message,'err');
 message('msg','Payment request rejected.','ok');await loadPayments()
}
async function setStatus(id,s){
 if(!confirm('Change business status to '+s+'?'))return;
 const {error}=await sb.from('businesses').update({status:s}).eq('id',id);
 if(error)return message('msg','Update failed: '+error.message,'err');message('msg','Business status changed to '+s+'.','ok');await loadBusinesses()
}

const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(URL,KEY);
$('login').onclick=async()=>{message('loginMsg','Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)message('loginMsg','Login failed: '+error.message,'err')};
$('logout').onclick=()=>sb.auth.signOut();$('refresh').onclick=loadBusinesses;$('refreshPayments').onclick=loadPayments;
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>enter(s),0));const {data:{session}}=await sb.auth.getSession();await enter(session);if(!session)message('loginMsg','Ready for secure administrator login.','ok');
</script></body></html>
