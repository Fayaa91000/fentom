<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBG Admin</title>
<style>body{font-family:Arial;margin:0;background:#f4f8fb;color:#17324a}header{background:#062b55;color:white;padding:20px}.wrap{max-width:1000px;margin:20px auto;padding:0 14px}.card,.biz{background:white;border:1px solid #d9e5ec;border-radius:16px;padding:18px;margin-bottom:14px}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ccdce5;border-radius:10px}button{border:0;border-radius:30px;padding:11px 16px;background:#0874a6;color:white;font-weight:bold;margin:4px}.approve{background:#137a3d}.reject{background:#b42318}.secondary{background:#eaf3f7;color:#062b55}.hidden{display:none}.msg{padding:12px;background:#edf6f8;border-radius:10px;margin:12px 0;white-space:pre-wrap}.ok{background:#e8f8ed;color:#176b38}.err{background:#ffe9e9;color:#8a2020}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{font-size:12px;font-weight:bold;padding:6px 10px;background:#eef4f7;border-radius:20px}.muted{color:#667b8c;font-size:13px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid #d9e5ec;border-radius:10px;padding:10px}.product img{width:100%;height:100px;object-fit:cover;border-radius:8px}@media(max-width:600px){.products{grid-template-columns:1fr 1fr}}</style></head>
<body><header><b style="font-size:22px">Maldives Business Gateway</b><div>Secure Admin Dashboard</div></header><div class="wrap">
<section id="loginBox" class="card"><h2>Administrator Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="login">Admin Login</button><div id="loginMsg" class="msg">Connecting...</div></section>
<section id="dash" class="hidden"><div class="card"><div class="top"><div><h2>MBG Admin Dashboard</h2><div id="who" class="muted"></div></div><button id="logout" class="secondary">Logout</button></div><div id="msg" class="msg">Ready.</div></div>
<div class="card"><div class="top"><h2>Business Applications</h2><button id="refresh" class="secondary">Refresh</button></div><div id="list"></div></div></section></div>
<script type="module">
const URL='https://ehavxdqegpoggrkoxypm.supabase.co', KEY='sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,user;
function msg(id,t,c=''){let e=$(id);e.textContent=t;e.className='msg '+c}
async function enter(session){user=session?.user;if(!user){$('loginBox').classList.remove('hidden');$('dash').classList.add('hidden');return}
 const {data,error}=await sb.from('mbg_admins').select('user_id').eq('user_id',user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();msg('loginMsg','Access denied. This account is not an MBG administrator.','err');return}
 $('loginBox').classList.add('hidden');$('dash').classList.remove('hidden');$('who').textContent=user.email;await load()}
async function load(){msg('msg','Loading businesses...');
 const {data,error}=await sb.from('businesses').select('*').order('created_at',{ascending:false});if(error)return msg('msg','Load failed: '+error.message,'err');
 $('list').innerHTML='';for(const b of data||[]){const {data:ps}=await sb.from('products').select('*').eq('business_id',b.id);
 let d=document.createElement('div');d.className='biz';d.innerHTML=`<div class="top"><div><h3>${esc(b.name)}</h3><div class="muted">${esc(b.category||'')} ${b.location?' • '+esc(b.location):''}</div></div><span class="pill">${esc((b.status||'pending').toUpperCase())}</span></div><p>${esc(b.description||'')}</p><div><b>Slug:</b> ${esc(b.slug)}<br><b>Phone:</b> ${esc(b.phone||'-')}</div><h4>Products (${(ps||[]).length})</h4><div class="products">${(ps||[]).map(p=>`<div class="product">${p.image_url?`<img src="${esc(p.image_url)}">`:''}<b>${esc(p.title)}</b><div>${p.price!=null?'MVR '+Number(p.price).toFixed(2):''}</div></div>`).join('')||'<span class="muted">No products</span>'}</div><p><button class="approve" data-id="${b.id}" data-s="approved">Approve</button><button class="reject" data-id="${b.id}" data-s="rejected">Reject</button><button class="secondary" data-id="${b.id}" data-s="pending">Pending</button></p>`;$('list').appendChild(d)}
 document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>change(x.dataset.id,x.dataset.s));msg('msg',`Loaded ${(data||[]).length} business application(s).`,'ok')}
async function change(id,status){if(!confirm('Change status to '+status+'?'))return;const {error}=await sb.from('businesses').update({status}).eq('id',id);if(error)return msg('msg','Update failed: '+error.message,'err');msg('msg','Status changed to '+status+'.','ok');await load()}
const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(URL,KEY);
$('login').onclick=async()=>{msg('loginMsg','Signing in...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg('loginMsg','Login failed: '+error.message,'err')};
$('logout').onclick=()=>sb.auth.signOut();$('refresh').onclick=load;sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>enter(s),0));const {data:{session}}=await sb.auth.getSession();await enter(session);if(!session)msg('loginMsg','Ready for administrator login.','ok');
</script></body></html>
