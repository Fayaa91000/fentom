<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBG Seller Orders</title>
<style>
:root{--navy:#062b55;--blue:#0874a6;--green:#137a3d;--red:#b42318;--bg:#f4f8fb;--line:#d9e5ec;--muted:#667b8c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17324a}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:20px}.wrap{max-width:980px;margin:20px auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 7px 22px #062b550b}
h2,h3{color:var(--navy)}input,textarea,select{width:100%;padding:12px;border:1px solid #cbdbe5;border-radius:10px;margin:6px 0 12px;font:inherit}
textarea{min-height:90px}button{border:0;border-radius:999px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer}
.secondary{background:#eaf3f7;color:var(--navy)}.green{background:var(--green)}.red,.danger{background:var(--red)}.hidden{display:none}
.msg{padding:12px;border-radius:10px;background:#edf6f8;margin:12px 0;white-space:pre-wrap}.ok{background:#e8f8ed;color:#176b38}.err{background:#ffe9e9;color:#8a2020}.warn{background:#fff5dc;color:#765300}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.muted{font-size:13px;color:var(--muted)}
.orders-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.orders-toolbar button{padding:8px 12px}
.order-card,.item{border:1px solid var(--line);border-left:5px solid #137a3d;border-radius:14px;padding:14px;margin:12px 0;background:#fff;box-shadow:0 4px 14px #062b5508}
.payment-evidence{border:2px solid #137a3d;background:linear-gradient(135deg,#edfff3,#f7fffa);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 5px 16px #137a3d16}
.payment-evidence-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;color:#0f6533;margin-bottom:8px}
.view-slip-btn{width:100%;border-radius:12px!important;padding:14px 16px!important;background:#137a3d!important;font-size:15px;margin:9px 0 6px;box-shadow:0 5px 12px #137a3d25}
.no-slip{border:1px dashed #d5a323;background:#fff9e8;border-radius:12px;padding:12px;margin:10px 0}
.shipping-box{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#f7fbfd}
.shipping-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shipping-details{margin-top:10px;padding:12px;border-radius:10px;background:#eef7fa;border:1px solid var(--line)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.nav a{text-decoration:none;background:#eaf3f7;color:var(--navy);font-weight:bold;padding:10px 14px;border-radius:999px}
@media(max-width:650px){.shipping-grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap" style="margin:0 auto;padding:0"><b style="font-size:22px">Maldives Business Gateway</b><div>Seller Portal — Orders</div></div></header>
<main class="wrap">
<section id="authBox" class="card"><h2>Seller Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button><div id="authMsg" class="msg">Ready.</div></section>

<section id="app" class="hidden">
<div class="card">
 <div class="top"><div><h2 style="margin:0">🛒 Customer Orders</h2><div id="who" class="muted"></div></div><button id="logout" class="secondary">Logout</button></div>
 <div id="msg" class="msg">Ready.</div>
</div>
<div class="nav">
 <a href="seller-portal.html">🏪 Main Seller Portal</a>
 <a href="seller-products.html">📦 Products</a>
 <a href="seller-disputes.html">🚨 Dispute Center</a>
</div>
<div id="customerOrdersCard" class="card hidden">
 <h3>🛒 Customer Orders</h3>
 <p class="muted">Verify money in your actual bank/payment gateway before confirming payment.</p>
 <div class="orders-toolbar"><button id="toggleOrders" class="green">🛒 Show Orders</button><button id="refreshOrders" class="secondary">↻ Refresh Orders</button></div>
 <div id="ordersMsg" class="msg">Orders are ready. Tap “Show Orders” to view them.</div>
 <div id="customerOrders" class="hidden"></div>
</div>
</section>
</main>

<script type="module">
const SUPABASE_URL='https://ehavxdqegpoggrkoxypm.supabase.co',KEY='sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,user,business,customerOrders=[];
function msg(id,t,c=''){let e=$(id);if(!e)return;e.textContent=t;e.className='msg '+c}

function orderStatusLabel(s){return ({payment_pending:'PAYMENT PENDING',payment_verified:'PAYMENT VERIFIED',order_accepted:'ORDER ACCEPTED',shipped:'SHIPPED',delivered:'DELIVERED',completed:'COMPLETED',cancelled:'CANCELLED',disputed:'DISPUTED',under_review:'UNDER REVIEW',refund_required:'REFUND REQUIRED',refund_submitted:'REFUND SUBMITTED',refunded:'REFUNDED',resolved:'RESOLVED',refund_overdue:'REFUND OVERDUE',seller_suspended:'SELLER SUSPENDED'})[s]||String(s||'').toUpperCase()}

function orderActions(o){
 if(o.status==='payment_pending')return `<button class="green" data-oa="${o.id}|verify_payment">✓ Confirm Payment Received</button> <button class="red" data-oa="${o.id}|cancel_unpaid">Cancel Unpaid Order</button>`;
 if(o.status==='payment_verified')return `<button class="green" data-oa="${o.id}|accept_order">Accept Order</button>`;
 if(o.status==='order_accepted')return `<button class="green" data-open-shipping="${o.id}">🚤 Add Shipping Details & Mark Shipped</button>
 <div id="shipbox-${o.id}" class="shipping-box hidden">
 <h4>🚚 Shipping / Delivery Information</h4>
 <p class="muted">Tell the buyer how the order was handed over. Shipping details are required.</p>
 <div class="shipping-grid">
 <div><label>Shipping Method *</label><select id="shipmethod-${o.id}"><option value="">Choose method</option><option>Local boat / dhoani</option><option>Speedboat / ferry</option><option>Courier</option><option>Post office</option><option>Hand delivery / person</option><option>Other</option></select></div>
 <div><label>Boat / Courier / Person / Provider</label><input id="shipprovider-${o.id}" placeholder="Boat name, courier or delivery person"></div>
 <div><label>Contact Number</label><input id="shipcontact-${o.id}" type="tel" placeholder="Contact number"></div>
 <div><label>Tracking / Reference</label><input id="shipreference-${o.id}" placeholder="Optional tracking/reference"></div>
 </div>
 <label>Shipping Details / Note *</label><textarea id="shipnote-${o.id}" placeholder="Example: Handed to Sea Star dhoani at Malé jetty. Expected tomorrow morning."></textarea>
 <button class="green" data-confirm-shipping="${o.id}">Confirm Shipped</button>
 <button class="secondary" data-cancel-shipping="${o.id}">Cancel</button>
 </div>`;
 if(o.status==='shipped')return `<button class="green" data-oa="${o.id}|mark_delivered">Mark Delivered</button>`;
 return `<span class="muted">No seller action available at this stage.</span>`;
}

async function loadCustomerOrders(){
 if(!business)return;
 msg('ordersMsg','Loading customer orders…');
 const {data,error}=await sb.from('orders').select('*').eq('business_id',business.id).order('created_at',{ascending:false});
 if(error)return msg('ordersMsg','Could not load orders: '+error.message,'err');
 const rows=data||[];customerOrders=rows;
 $('customerOrders').innerHTML=rows.map(o=>`<div class="item order-card">
 <div><b>Order Reference:</b> ${esc(o.id)}</div><div class="muted">${new Date(o.created_at).toLocaleString()}</div>
 <p><b>Status:</b> ${esc(orderStatusLabel(o.status))}<br><b>Total:</b> MVR ${Number(o.total_price||0).toFixed(2)}<br><b>Quantity:</b> ${esc(o.quantity)}</p>
 <p><b>Customer:</b> ${esc(o.customer_name)}<br><b>Phone:</b> ${esc(o.customer_phone)}<br><b>Island / Location:</b> ${esc(o.customer_island||'—')}<br><b>Delivery Address:</b> ${esc(o.delivery_address||'—')}</p>
 <p><b>Payment Method:</b> ${esc((o.payment_method||'').replaceAll('_',' '))}<br><b>Payment Reference:</b> ${esc(o.payment_reference||'—')}</p>
 ${o.payment_slip_path?`<div class="payment-evidence"><div class="payment-evidence-title">🧾 PAYMENT SLIP READY TO REVIEW</div>${o.payment_slip_name?`<div class="muted">Uploaded file: ${esc(o.payment_slip_name)}</div>`:''}<button class="view-slip-btn" data-view-slip="${o.id}">👁️ VIEW PAYMENT SLIP</button><div class="muted">Check the actual money received in your bank/payment account before confirming payment.</div></div>`:`<div class="no-slip"><b>🧾 Payment Slip:</b> No slip attached to this order.</div>`}
 ${o.customer_note?`<p><b>Customer Note:</b> ${esc(o.customer_note)}</p>`:''}
 ${(o.shipping_method||o.shipping_note||o.shipping_provider_name||o.shipping_contact||o.shipping_reference)?`<div class="shipping-details"><b>🚚 Shipping Details</b><br><b>Method:</b> ${esc(o.shipping_method||'—')}<br><b>Provider / Boat / Person:</b> ${esc(o.shipping_provider_name||'—')}<br><b>Contact:</b> ${esc(o.shipping_contact||'—')}<br><b>Tracking / Reference:</b> ${esc(o.shipping_reference||'—')}<br><b>Note:</b> ${esc(o.shipping_note||'—')}</div>`:''}
 <div class="msg"><b>Important:</b> A reference number is not proof of payment. Check your actual bank/payment gateway first.</div>
 <div>${orderActions(o)}</div></div>`).join('')||'<div class="msg">No customer orders yet.</div>';
 document.querySelectorAll('[data-oa]').forEach(x=>x.onclick=()=>{const [id,a]=x.dataset.oa.split('|');sellerOrderAction(id,a)});
 document.querySelectorAll('[data-open-shipping]').forEach(x=>x.onclick=()=>document.getElementById('shipbox-'+x.dataset.openShipping)?.classList.remove('hidden'));
 document.querySelectorAll('[data-cancel-shipping]').forEach(x=>x.onclick=()=>document.getElementById('shipbox-'+x.dataset.cancelShipping)?.classList.add('hidden'));
 document.querySelectorAll('[data-confirm-shipping]').forEach(x=>x.onclick=()=>markOrderShipped(x.dataset.confirmShipping));
 document.querySelectorAll('[data-view-slip]').forEach(x=>x.onclick=()=>viewPaymentSlip(x.dataset.viewSlip));
 msg('ordersMsg',`${rows.length} customer order(s) loaded.`,'ok');
}

async function viewPaymentSlip(id){
 const o=customerOrders.find(x=>x.id===id);
 if(!o||!o.payment_slip_path)return msg('ordersMsg','No payment slip is attached to this order.','err');
 const popup=window.open('','_blank');
 if(popup)popup.document.write('<title>MBG Payment Slip</title><p style="font-family:Arial;padding:20px">Loading payment slip securely…</p>');
 msg('ordersMsg','Opening payment slip securely…');
 const {data,error}=await sb.storage.from('payment-slips').download(o.payment_slip_path);
 if(error){if(popup)popup.close();return msg('ordersMsg','Could not open payment slip: '+error.message,'err');}
 const blobUrl=URL.createObjectURL(data);
 if(popup)popup.location.href=blobUrl; else window.location.href=blobUrl;
 msg('ordersMsg','Payment slip opened. Verify the actual payment before confirming it.','ok');
 setTimeout(()=>URL.revokeObjectURL(blobUrl),120000);
}

async function markOrderShipped(id){
 const method=$('shipmethod-'+id)?.value.trim()||'',provider=$('shipprovider-'+id)?.value.trim()||'',contact=$('shipcontact-'+id)?.value.trim()||'',reference=$('shipreference-'+id)?.value.trim()||'',note=$('shipnote-'+id)?.value.trim()||'';
 if(!method)return msg('ordersMsg','Please choose a shipping method.','err');
 if(note.length<10)return msg('ordersMsg','Please enter shipping details of at least 10 characters.','err');
 if(!confirm(`Mark this order as SHIPPED?\n\nMethod: ${method}\nProvider/Boat/Person: ${provider||'—'}\nContact: ${contact||'—'}\nReference: ${reference||'—'}\nDetails: ${note}`))return;
 msg('ordersMsg','Saving shipping details…');
 const {error}=await sb.rpc('mbg_mark_order_shipped',{target_order:id,shipping_method_input:method,shipping_provider_input:provider||null,shipping_contact_input:contact||null,shipping_reference_input:reference||null,shipping_note_input:note});
 if(error)return msg('ordersMsg','Could not mark order as shipped: '+error.message,'err');
 msg('ordersMsg','Order marked as shipped and shipping details saved successfully.','ok');
 await loadCustomerOrders();
}

async function sellerOrderAction(id,action){
 const prompts={verify_payment:'Have you checked your actual bank/payment gateway and received this payment?',accept_order:'Are you ready to accept and fulfill this order?',mark_shipped:'Have you shipped this order?',mark_delivered:'Has this order been delivered successfully?',cancel_unpaid:'Are you sure you want to cancel this unpaid order?'};
 const labels={verify_payment:'Confirm Received',accept_order:'Confirm Order',mark_shipped:'Confirm Shipped',mark_delivered:'Confirm Delivered',cancel_unpaid:'Confirm Cancellation'};
 if(!confirm((prompts[action]||'Confirm this action?')+'\n\n'+(labels[action]||'Confirm')))return;
 const {error}=await sb.rpc('mbg_seller_order_action',{target_order:id,requested_action:action,action_note:null});
 if(error)return msg('ordersMsg','Order action failed: '+error.message,'err');
 msg('ordersMsg','Order updated successfully and recorded automatically in order history.','ok');
 await loadCustomerOrders();
}

async function load(){
 const {data:b,error}=await sb.from('businesses').select('*').eq('owner_id',user.id).order('created_at',{ascending:true}).limit(1).maybeSingle();
 if(error)return msg('msg','Could not load business: '+error.message,'err');
 business=b;
 if(!business){$('customerOrdersCard').classList.add('hidden');return msg('msg','No business profile found. Open the Main Seller Portal and create your business first.','warn')}
 $('customerOrdersCard').classList.remove('hidden');
 msg('msg',`Managing orders for ${business.name||'your business'}.`,'ok');
 await loadCustomerOrders();
}

const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(SUPABASE_URL,KEY);
$('login').onclick=async()=>{msg('authMsg','Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg('authMsg','Login failed: '+error.message,'err')};
$('logout').onclick=()=>sb.auth.signOut();
$('refreshOrders').onclick=loadCustomerOrders;
$('toggleOrders').onclick=()=>{const box=$('customerOrders'),hidden=box.classList.toggle('hidden');$('toggleOrders').textContent=hidden?'🛒 Show Orders':'🙈 Hide Orders'};

sb.auth.onAuthStateChange(async(_event,session)=>{
 user=session?.user||null;
 if(user){
  $('authBox').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||user.id;
  await load();
 }else{
  $('app').classList.add('hidden');$('authBox').classList.remove('hidden');business=null;customerOrders=[];
 }
});
const {data:{session}}=await sb.auth.getSession();
if(session?.user){user=session.user;$('authBox').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||user.id;await load()}
</script>
</body></html>
