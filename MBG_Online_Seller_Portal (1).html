<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBG Online Seller Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#062b55;--b:#0874a6;--c:#12b8c8;--bg:#f3f8fb;--w:#fff;--t:#18324a;--m:#6d7e8c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,textarea,select{font:inherit}.wrap{width:min(1050px,92%);margin:auto}
header{background:#fff;border-bottom:1px solid #e1ebf0}nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:var(--n)}.brand span{color:var(--c)}
main{padding:32px 0 70px}.hero{padding:30px;border-radius:25px;background:linear-gradient(135deg,var(--n),var(--b),var(--c));color:#fff;margin-bottom:22px}.hero h1{margin:0}.hero p{margin-bottom:0;color:#dffbff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border-radius:18px;padding:23px;box-shadow:0 8px 25px #062b5510;margin-bottom:20px}h2,h3{color:var(--n)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cddde5;border-radius:11px}textarea{min-height:90px}
.btn{border:0;border-radius:999px;padding:11px 17px;background:linear-gradient(135deg,var(--b),var(--c));color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.alt{background:#e6f5f7;color:var(--n)}.danger{background:#9c3040}
.hidden{display:none!important}.msg{padding:11px;background:#e9f8f8;border-radius:10px;margin-top:12px;font-size:14px}.small{font-size:12px;color:var(--m)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.product{border:1px solid #e0eaef;border-radius:14px;padding:13px}.pic{height:130px;border-radius:11px;background:#e8f4f7 center/cover no-repeat;display:grid;place-items:center;font-size:32px}.price{font-weight:900;color:var(--b)}
.topactions{display:flex;gap:8px;flex-wrap:wrap}.status{display:inline-block;padding:5px 9px;border-radius:99px;background:#fff4ce;color:#806100;font-size:12px;font-weight:bold}
@media(max-width:720px){.grid,.products{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap"><nav><div class="brand">MBG <span>Online Seller Portal</span></div><div id="userEmail" class="small"></div></nav></div></header>
<main><div class="wrap">
<div class="hero"><h1>Maldives Business Gateway</h1><p>Seller accounts and business listings powered by the MBG online database.</p></div>

<section id="auth" class="grid">
<div class="panel"><h2>Create Seller Account</h2><label>Name</label><input id="name"><label>Email</label><input id="signupEmail" type="email"><label>Password</label><input id="signupPass" type="password" minlength="6"><button class="btn" onclick="signup()">Register</button><div id="signupMsg"></div></div>
<div class="panel"><h2>Login</h2><label>Email</label><input id="loginEmail" type="email"><label>Password</label><input id="loginPass" type="password"><button class="btn" onclick="login()">Login</button><div id="loginMsg"></div></div>
</section>

<section id="app" class="hidden">
<div class="topactions"><button class="btn alt" onclick="loadData()">Refresh</button><button class="btn alt" onclick="logout()">Logout</button></div>
<div class="panel">
<h2>Your Business <span id="status" class="status">NEW</span></h2>
<div class="grid"><div><label>Business Name</label><input id="bizName"></div><div><label>Category</label><select id="bizCat"><option>Retail</option><option>Food & Beverage</option><option>Technology</option><option>Tourism</option><option>Professional Services</option><option>Home Business</option><option>Other</option></select></div><div><label>Island / Location</label><input id="bizLoc"></div><div><label>Phone / Viber / WhatsApp</label><input id="bizPhone"></div></div>
<label>Description</label><textarea id="bizDesc"></textarea><label>Order / Website / Payment Link</label><input id="bizLink" placeholder="https://...">
<label>Business Logo (optional)</label><input id="logoFile" type="file" accept="image/*">
<button class="btn" onclick="saveBusiness()">Save Business</button><div id="bizMsg"></div>
</div>

<div id="productPanel" class="panel hidden"><h2>Add Product / Service</h2>
<div class="grid"><div><label>Title</label><input id="pTitle"></div><div><label>Price MVR</label><input id="pPrice" type="number" step=".01"></div></div>
<label>Description</label><textarea id="pDesc"></textarea><label>Product Image</label><input id="pFile" type="file" accept="image/*">
<button class="btn" onclick="addProduct()">Publish Product</button><div id="pMsg"></div>
<h3>Your Products</h3><div id="products" class="products"></div></div>
</section>
</div></main>
<script>
const URL='https://ehavxdqegpoggrkoxypm.supabase.co';
const KEY='sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';
const db=window.supabase.createClient(URL,KEY);
const $=x=>document.getElementById(x);let user=null,business=null;
function note(id,s){$(id).innerHTML='<div class="msg">'+s+'</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function slug(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString().slice(-5)}
async function signup(){const email=$('signupEmail').value.trim(),password=$('signupPass').value,name=$('name').value.trim();const {data,error}=await db.auth.signUp({email,password,options:{data:{name}}});if(error)return note('signupMsg',esc(error.message));note('signupMsg',data.session?'Account created and signed in.':'Account created. Check your email for the confirmation link, then login.')}
async function login(){const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPass').value});if(error)note('loginMsg',esc(error.message))}
async function logout(){await db.auth.signOut()}
async function upload(file,prefix){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');const path=`${user.id}/${prefix}-${Date.now()}.${ext}`;const {error}=await db.storage.from('mbg-images').upload(path,file);if(error)throw error;return db.storage.from('mbg-images').getPublicUrl(path).data.publicUrl}
async function saveBusiness(){try{
 const name=$('bizName').value.trim();if(!name)return note('bizMsg','Business name is required.');
 let logo=business?.logo_url||null;const f=$('logoFile').files[0];if(f)logo=await upload(f,'logo');
 const payload={owner_id:user.id,name,category:$('bizCat').value,location:$('bizLoc').value.trim(),phone:$('bizPhone').value.trim(),description:$('bizDesc').value.trim(),order_link:$('bizLink').value.trim()||null,logo_url:logo,updated_at:new Date().toISOString()};
 let res;if(business)res=await db.from('businesses').update(payload).eq('id',business.id).select().single();else res=await db.from('businesses').insert({...payload,slug:slug(name)}).select().single();
 if(res.error)throw res.error;business=res.data;note('bizMsg','Saved online successfully. Status: '+business.status);await loadData();
}catch(e){note('bizMsg',esc(e.message))}}
async function addProduct(){try{
 if(!business)return note('pMsg','Save your business first.');const title=$('pTitle').value.trim();if(!title)return note('pMsg','Product title is required.');
 const f=$('pFile').files[0],image=f?await upload(f,'product'):null;
 const {error}=await db.from('products').insert({business_id:business.id,owner_id:user.id,title,price:$('pPrice').value||null,description:$('pDesc').value.trim(),image_url:image});if(error)throw error;
 $('pTitle').value='';$('pPrice').value='';$('pDesc').value='';$('pFile').value='';note('pMsg','Product saved online.');await renderProducts();
}catch(e){note('pMsg',esc(e.message))}}
async function removeProduct(id){if(!confirm('Remove this product?'))return;const {error}=await db.from('products').delete().eq('id',id);if(error)alert(error.message);else renderProducts()}
async function renderProducts(){const {data,error}=await db.from('products').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)return;$('products').innerHTML=(data||[]).map(p=>`<div class="product"><div class="pic" ${p.image_url?`style="background-image:url('${esc(p.image_url)}')"`:''}>${p.image_url?'':'🛍️'}</div><h3>${esc(p.title)}</h3><div class="price">${p.price!==null?'MVR '+esc(p.price):'Contact for price'}</div><p class="small">${esc(p.description)}</p><button class="btn danger" onclick="removeProduct('${p.id}')">Remove</button></div>`).join('')||'<p class="small">No products yet.</p>'}
async function loadData(){const {data}=await db.from('businesses').select('*').eq('owner_id',user.id).order('created_at',{ascending:true}).limit(1);business=data?.[0]||null;if(business){$('bizName').value=business.name||'';$('bizCat').value=business.category||'Retail';$('bizLoc').value=business.location||'';$('bizPhone').value=business.phone||'';$('bizDesc').value=business.description||'';$('bizLink').value=business.order_link||'';$('status').textContent=(business.status||'pending').toUpperCase();$('productPanel').classList.remove('hidden');await renderProducts()}else{$('status').textContent='NEW';$('productPanel').classList.add('hidden')}}
async function applySession(session){user=session?.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('userEmail').textContent=user?.email||'';if(user)await loadData()}
db.auth.onAuthStateChange((_event,session)=>setTimeout(()=>applySession(session),0));
db.auth.getSession().then(({data})=>applySession(data.session));
</script></body></html>
