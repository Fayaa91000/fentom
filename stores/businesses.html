<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MBG Marketplace — Businesses</title>

<style>

:root{
  --navy:#062b55;
  --blue:#0874a6;
  --teal:#13a3a0;
  --bg:#f4f8fb;
  --line:#dbe7ed;
  --text:#17324a;
  --muted:#667b8c
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}

header{
  background:linear-gradient(
    135deg,
    var(--navy),
    var(--blue),
    var(--teal)
  );
  color:#fff;
  padding:22px 0
}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:0 15px
}

.brand{
  font-size:24px;
  font-weight:800
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px
}

.nav a{
  color:#fff;
  text-decoration:none;
  background:#ffffff18;
  padding:8px 13px;
  border-radius:999px;
  font-weight:bold
}

.nav a.active{
  background:#fff;
  color:var(--navy)
}

.hero{
  padding:28px 0 18px
}

.hero h1{
  font-size:36px;
  margin:0 0 8px;
  color:var(--navy)
}

.muted{
  color:var(--muted)
}

.controls{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
  margin:18px 0
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #cbdbe5;
  border-radius:12px;
  background:#fff;
  font:inherit
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:25px 0 12px
}

.sectionTitle h2{
  margin:0;
  color:var(--navy)
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 7px 22px #062b550b
}

.cover{
  height:150px;
  background:linear-gradient(
    135deg,
    #e8f3f8,
    #d9efef
  );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover
}

.logo{
  width:88px!important;
  height:88px!important;
  object-fit:cover!important;
  border-radius:50%;
  border:4px solid #fff;
  box-shadow:0 4px 15px #0002
}

.body{
  padding:15px
}

.body h3{
  margin:0 0 6px;
  color:var(--navy)
}

.pill{
  display:inline-block;
  padding:5px 9px;
  background:#eaf5f7;
  border-radius:999px;
  font-size:12px;
  margin:3px 4px 3px 0
}

button,.btn{
  display:inline-block;
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:var(--blue);
  color:#fff;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer
}

.secondary{
  background:#eaf3f7;
  color:var(--navy)
}

.msg{
  background:#fff;
  border:1px solid var(--line);
  padding:16px;
  border-radius:14px;
  margin:12px 0
}

.error{
  color:#8a2020;
  background:#fff0f0
}

.productImg{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#edf4f7
}

.price{
  font-size:18px;
  font-weight:800;
  color:var(--navy);
  margin:8px 0
}

.shopBrand{
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#fff;
  box-shadow:0 7px 22px #062b550b
}

.shopBanner{
  height:220px;
  background:linear-gradient(
    135deg,
    #e8f3f8,
    #d9efef
  );
  background-size:cover;
  background-position:center;
  position:relative
}

.shopBannerLogo{
  position:absolute;
  left:22px;
  bottom:-45px;
  width:96px!important;
  height:96px!important;
  border-radius:22px!important;
  object-fit:cover;
  border:5px solid #fff!important;
  box-shadow:0 5px 18px #0003
}

.shopBrandBody{
  padding:58px 20px 20px
}

.shopBrandBody h2{
  margin:0 0 5px
}

.shopBrand .brandBtn{
  color:#fff!important
}

.shopBrand .brandPill{
  color:#17324a
}

footer{
  margin-top:40px;
  background:var(--navy);
  color:#fff;
  padding:24px 0
}

@media(max-width:780px){

.grid{
  grid-template-columns:1fr 1fr
}

.hero h1{
  font-size:30px
}

}

@media(max-width:520px){

.grid,
.controls{
  grid-template-columns:1fr
}

}

</style>

</head>

<body>


<header>

<div class="wrap">

<div class="brand">
Maldives Business Gateway
</div>

<div>
Discover local businesses and products
</div>

<div class="nav">

<a
href="stores.html">
🛍️ Products
</a>

<a
class="active"
href="businesses.html">
🏪 Businesses
</a>

</div>

</div>

</header>


<main class="wrap">


<section class="hero">

<h1>
MBG Businesses
</h1>

<p class="muted">

Browse approved businesses
and their active products
across the Maldives.

</p>

</section>


<section id="marketView">


<div class="controls">

<input
id="search"
placeholder="Search businesses, categories or locations…"
>

<select id="category">

<option value="">
All categories
</option>

</select>

</div>


<div
id="status"
class="msg">

Loading businesses…

</div>


<div class="sectionTitle">

<h2>
🏪 All Registered Businesses
</h2>

<span
id="businessCount"
class="muted">
</span>

</div>


<div
id="businesses"
class="grid">
</div>


</section>



<!-- SHOP VIEW -->

<section
id="shopView"
style="display:none"
>

<button
id="back"
class="secondary">

← Back to Businesses

</button>


<div
id="shopInfo"
class="msg"
style="margin-top:16px">
</div>


<div class="sectionTitle">

<h2>
Products
</h2>

<span
id="shopCount"
class="muted">
</span>

</div>


<div
id="shopProducts"
class="grid">
</div>

</section>


</main>


<footer>

<div class="wrap">

<b>
Maldives Business Gateway
</b>

<div
style="opacity:.8;margin-top:5px">

Connect • Empower • Prosper

</div>

</div>

</footer>



<script type="module">


const URL =
'https://ehavxdqegpoggrkoxypm.supabase.co';


const KEY =
'sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';


const {
createClient
} =
await import(
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
);


const sb =
createClient(
URL,
KEY
);


const $ =
x =>
document.getElementById(x);


const esc =
s =>
String(s??'').replace(
/[&<>"]/g,
c =>
({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[c])
);


const safeColor =
(value,fallback) =>
/^#[0-9A-Fa-f]{6}$/.test(
String(value||'')
)
?
value
:
fallback;


let businesses = [];

let products = [];



/* =========================
   LOAD
========================= */

async function load(){

const [
br,
pr
] =
await Promise.all([

sb
.from('businesses')
.select(
'id,owner_id,name,slug,category,location,phone,description,order_link,logo_url,cover_url,primary_color,accent_color,status'
)
.eq(
'status',
'approved'
)
.order(
'created_at',
{
ascending:false
}
),

sb
.from('products')
.select(
'id,business_id,title,description,price,image_url,active'
)
.eq(
'active',
true
)
.order(
'created_at',
{
ascending:false
}
)

]);


if(
br.error ||
pr.error
){

$('status')
.className =
'msg error';

$('status')
.textContent =
'Marketplace could not load: ' +
(
br.error?.message ||
pr.error?.message
);

return;

}


businesses =
br.data || [];

products =
pr.data || [];


const cats =
[
...new Set(
businesses
.map(
b=>b.category
)
.filter(Boolean)
)
].sort();


$('category')
.innerHTML =
'<option value="">All categories</option>' +

cats
.map(
c =>
`<option>
${esc(c)}
</option>`
)
.join('');


$('status')
.style.display =
'none';


render();

}



/* =========================
   FILTER
========================= */

function filtered(){

const q =
$('search')
.value
.trim()
.toLowerCase();


const cat =
$('category')
.value;


return businesses.filter(
b =>

(
!cat ||
b.category === cat
)

&&

(
!q ||

[
b.name,
b.category,
b.location,
b.description
]
.some(
v =>
String(v||'')
.toLowerCase()
.includes(q)
)

)

);

}



/* =========================
   BUSINESS CARD RENDER
========================= */

function render(){

const bs =
filtered();


$('businessCount')
.textContent =
bs.length +
' found';


$('businesses').innerHTML =

bs
.map(
b => {

const pc =
safeColor(
b.primary_color,
'#0F766E'
);

const ac =
safeColor(
b.accent_color,
'#2563EB'
);


const count =
products.filter(
p =>
p.business_id === b.id
).length;


return `

<article class="card">


<div
class="cover"

${
b.cover_url

?

`style="
background-image:url('${esc(b.cover_url)}');
background-size:cover;
background-position:center
"`

:

''
}

>

${
b.logo_url

?

`<img
class="logo"
src="${esc(b.logo_url)}"
alt=""
>`

:

'🏪'

}

</div>


<div class="body">


<h3
style="color:${pc}">

${esc(b.name)}

</h3>


<span class="pill">

${esc(
b.category ||
'Business'
)}

</span>


${
b.location

?

`<span class="pill">

${esc(b.location)}

</span>`

:

''
}


<span class="pill">

${count}

product${count===1?'':'s'}

</span>


<p class="muted">

${esc(
b.description ||
''
)}

</p>


<button
style="background:${ac}"
data-shop="${b.id}">

View Shop

</button>


</div>

</article>

`;

}
)
.join('')

||

'<div class="msg">
No businesses found.
</div>';


document
.querySelectorAll(
'[data-shop]'
)
.forEach(
x =>
x.onclick =
() =>
openShop(
x.dataset.shop
)
);

}



/* =========================
   PRODUCT CARD
========================= */

function productCard(p){

return `

<article class="card">


${
p.image_url

?

`<img
class="productImg"
src="${esc(p.image_url)}"
alt=""
>`

:

`<div
class="productImg">
</div>`

}


<div class="body">


<h3>

${esc(p.title)}

</h3>


<div class="price">

${
p.price != null

?

'MVR ' +
Number(p.price)
.toFixed(2)

:

'Contact seller'

}

</div>


<p class="muted">

${esc(
p.description ||
''
)}

</p>


<a
class="btn"
href="stores.html#product=${encodeURIComponent(p.id)}">

View Product

</a>


</div>

</article>

`;

}



/* =========================
   OPEN SHOP
========================= */

function openShop(id){

const b =
businesses.find(
x =>
x.id === id
);


if(!b)
return;


$('marketView')
.style.display =
'none';


$('shopView')
.style.display =
'block';


const pc =
safeColor(
b.primary_color,
'#0F766E'
);


const ac =
safeColor(
b.accent_color,
'#2563EB'
);


$('shopInfo')
.className =
'shopBrand';


$('shopInfo').innerHTML = `

<div
class="shopBanner"

style="${
b.cover_url

?

`background-image:url('${esc(b.cover_url)}');`

:

''
}

background-color:${pc}22">

${
b.logo_url

?

`<img
class="shopBannerLogo"
src="${esc(b.logo_url)}"
alt=""
>`

:

''
}

</div>


<div
class="shopBrandBody">


<h2
style="color:${pc}">

${esc(b.name)}

</h2>


<div>

${esc(
b.category ||
''
)}

${
b.location

?

' • ' +
esc(b.location)

:

''
}

</div>


<p>

${esc(
b.description ||
''
)}

</p>


<div>

${
b.phone

?

`<span
class="pill brandPill">

📞 ${esc(b.phone)}

</span>`

:

''
}

</div>


${
b.order_link

?

`<p>

<a
class="btn brandBtn"
style="background:${ac}"
href="${esc(b.order_link)}"
target="_blank"
rel="noopener noreferrer">

Order / Contact Seller

</a>

</p>`

:

''
}


<p>

<a
class="btn secondary"
href="stores.html">

🛍️ Browse All Products

</a>

</p>


</div>

`;


const ps =
products.filter(
p =>
p.business_id === id
);


$('shopCount')
.textContent =
ps.length +
' product(s)';


$('shopProducts').innerHTML =

ps
.map(productCard)
.join('')

||

'<div class="msg">

No active products available.

</div>';


history.replaceState(
null,
'',
'#shop=' +
encodeURIComponent(
b.slug ||
b.id
)
);


window.scrollTo({
top:0,
behavior:'smooth'
});

}



/* =========================
   NAVIGATION
========================= */

$('back')
.onclick =
() =>
location.href =
'businesses.html';


$('search')
.oninput =
render;


$('category')
.onchange =
render;



/* =========================
   INITIAL LOAD
========================= */

await load();


const shopParam =
decodeURIComponent(

(
location.hash.match(
/^#shop=(.*)$/
)
||[]
)[1] || ''

);


if(shopParam){

const b =
businesses.find(
x =>
x.slug === shopParam ||
x.id === shopParam
);


if(b){

openShop(
b.id
);

}

}


</script>

</body>
</html>
