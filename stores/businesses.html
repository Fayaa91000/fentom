<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MBG Marketplace — Businesses</title>

<style>
:root{
  --navy:#062b55;
  --blue:#0874a6;
  --teal:#13a3a0;
  --bg:#f4f8fb;
  --line:#dbe7ed;
  --text:#17324a;
  --muted:#667b8c
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}

header{
  background:linear-gradient(135deg,var(--navy),var(--blue),var(--teal));
  color:#fff;
  padding:22px 0
}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:0 15px
}

.brand{
  font-size:24px;
  font-weight:800
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px
}

.nav a{
  color:#fff;
  text-decoration:none;
  background:#ffffff18;
  padding:8px 13px;
  border-radius:999px;
  font-weight:bold
}

.nav a.active{
  background:#fff;
  color:var(--navy)
}

.hero{
  padding:28px 0 18px
}

.hero h1{
  font-size:36px;
  margin:0 0 8px;
  color:var(--navy)
}

.muted{
  color:var(--muted)
}

.controls{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
  margin:18px 0
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #cbdbe5;
  border-radius:12px;
  background:#fff;
  font:inherit
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:25px 0 12px
}

.sectionTitle h2{
  margin:0;
  color:var(--navy)
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 7px 22px #062b550b
}

.cover{
  height:150px;
  background:linear-gradient(135deg,#e8f3f8,#d9efef);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover
}

.logo{
  width:88px!important;
  height:88px!important;
  object-fit:cover!important;
  border-radius:50%;
  border:4px solid #fff;
  box-shadow:0 4px 15px #0002
}

.body{
  padding:15px
}

.body h3{
  margin:0 0 6px;
  color:var(--navy)
}

.pill{
  display:inline-block;
  padding:5px 9px;
  background:#eaf5f7;
  border-radius:999px;
  font-size:12px;
  margin:3px 4px 3px 0
}

button,.btn{
  display:inline-block;
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:var(--blue);
  color:#fff;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer
}

.secondary{
  background:#eaf3f7;
  color:var(--navy)
}

.msg{
  background:#fff;
  border:1px solid var(--line);
  padding:16px;
  border-radius:14px;
  margin:12px 0
}

.error{
  color:#8a2020;
  background:#fff0f0
}

.productImg{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#edf4f7
}

.price{
  font-size:18px;
  font-weight:800;
  color:var(--navy);
  margin:8px 0
}

.shopBrand{
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#fff;
  box-shadow:0 7px 22px #062b550b
}

.shopBanner{
  height:220px;
  background:linear-gradient(135deg,#e8f3f8,#d9efef);
  background-size:cover;
  background-position:center;
  position:relative
}

.shopBannerLogo{
  position:absolute;
  left:22px;
  bottom:-45px;
  width:96px!important;
  height:96px!important;
  border-radius:22px!important;
  object-fit:cover;
  border:5px solid #fff!important;
  box-shadow:0 5px 18px #0003
}

.shopBrandBody{
  padding:58px 20px 20px
}

.shopBrandBody h2{
  margin:0 0 5px
}

footer{
  margin-top:40px;
  background:var(--navy);
  color:#fff;
  padding:24px 0
}

@media(max-width:780px){
  .grid{grid-template-columns:1fr 1fr}
  .hero h1{font-size:30px}
}

@media(max-width:520px){
  .grid,.controls{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="wrap">

<div class="brand">
Maldives Business Gateway
</div>

<div>
Discover local businesses and products
</div>

<div class="nav">
<a href="stores.html">🛍️ Products</a>
<a class="active" href="businesses.html">🏪 Businesses</a>
</div>

</div>
</header>

<main class="wrap">

<section class="hero">

<h1>MBG Businesses</h1>

<p class="muted">
Browse approved businesses and their active products across the Maldives.
</p>

</section>


<section id="marketView">

<div class="controls">

<input
id="search"
placeholder="Search businesses, products or locations…"
>

<select id="category">
<option value="">All categories</option>
</select>

</div>

<div id="status" class="msg">
Loading businesses…
</div>

<div class="sectionTitle">

<h2>🏪 All Registered Businesses</h2>

<span id="businessCount" class="muted"></span>

</div>

<div id="businesses" class="grid"></div>

</section>


<section id="shopView" style="display:none">

<button id="back" class="secondary">
← Back to Businesses
</button>

<div
id="shopInfo"
class="msg"
style="margin-top:16px">
</div>

<div class="sectionTitle">

<h2>Products</h2>

<span id="shopCount" class="muted"></span>

</div>

<div id="shopProducts" class="grid"></div>

</section>

</main>


<footer>

<div class="wrap">

<b>Maldives Business Gateway</b>

<div style="opacity:.8;margin-top:5px">
Connect • Empower • Prosper
</div>

</div>

</footer>


<!-- IMPORTANT:
     Use normal browser script instead of module import.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://ehavxdqegpoggrkoxypm.supabase.co';

const SUPABASE_KEY =
'sb_publishable_D6SZ5U43h7B5FgyFfgGgIg_6tL-5Jis';


const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const $ =
id => document.getElementById(id);


const esc =
s =>
String(s ?? '').replace(
/[&<>"]/g,
c => ({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[c])
);


const safeColor =
(value,fallback) =>
/^#[0-9A-Fa-f]{6}$/.test(
String(value || '')
)
? value
: fallback;


let businesses = [];
let products = [];



/* ============================
   LOAD EVERYTHING
============================ */

async function loadMarketplace(){

$('status').style.display = 'block';
$('status').className = 'msg';
$('status').textContent = 'Loading businesses and products…';


try{

const businessResult =
await sb
.from('businesses')
.select(
'id,owner_id,name,slug,category,location,phone,description,order_link,logo_url,cover_url,primary_color,accent_color,status'
)
.eq(
'status',
'approved'
)
.order(
'created_at',
{
ascending:false
}
);


if(businessResult.error){

throw new Error(
'Businesses: ' +
businessResult.error.message
);

}


businesses =
businessResult.data || [];


const productResult =
await sb
.from('products')
.select(
'id,business_id,title,description,price,image_url,active'
)
.eq(
'active',
true
)
.order(
'created_at',
{
ascending:false
}
);


if(productResult.error){

throw new Error(
'Products: ' +
productResult.error.message
);

}


products =
productResult.data || [];


console.log(
'MBG businesses:',
businesses
);

console.log(
'MBG products:',
products
);


const categories =
[
...new Set(
businesses
.map(
b => b.category
)
.filter(Boolean)
)
].sort();


$('category').innerHTML =
'<option value="">All categories</option>' +

categories
.map(
c =>
`<option value="${esc(c)}">${esc(c)}</option>`
)
.join('');


$('status').style.display =
'none';


renderBusinesses();

}

catch(error){

console.error(
'MBG LOAD ERROR:',
error
);


$('status').className =
'msg error';


$('status').innerHTML = `

<b>
Marketplace could not load.
</b>

<br><br>

${esc(error.message)}

<br><br>

Open the browser console with
<b>F12 → Console</b>
if you need to inspect the error.

`;

}

}



/* ============================
   FILTER
============================ */

function getFilteredBusinesses(){

const q =
$('search')
.value
.trim()
.toLowerCase();


const category =
$('category')
.value;


return businesses.filter(
business => {

const matchesCategory =
!category ||
business.category === category;


const matchesSearch =
!q ||

[
business.name,
business.category,
business.location,
business.description
]
.some(
value =>
String(value || '')
.toLowerCase()
.includes(q)
);


return (
matchesCategory &&
matchesSearch
);

});

}



/* ============================
   RENDER BUSINESSES
============================ */

function renderBusinesses(){

const list =
getFilteredBusinesses();


$('businessCount')
.textContent =
list.length + ' found';


$('businesses').innerHTML =

list.map(
business => {

const primary =
safeColor(
business.primary_color,
'#0F766E'
);


const accent =
safeColor(
business.accent_color,
'#2563EB'
);


const productCount =
products.filter(
p =>
p.business_id === business.id
).length;


return `

<article class="card">


<div
class="cover"

${
business.cover_url

?

`style="
background-image:url('${esc(business.cover_url)}');
background-size:cover;
background-position:center;
"`

:

''
}

>

${
business.logo_url

?

`<img
class="logo"
src="${esc(business.logo_url)}"
alt="${esc(business.name)}"
>`

:

'🏪'

}

</div>


<div class="body">


<h3 style="color:${primary}">

${esc(business.name)}

</h3>


<span class="pill">

${esc(
business.category ||
'Business'
)}

</span>


${
business.location

?

`<span class="pill">

${esc(business.location)}

</span>`

:

''
}


<span class="pill">

${productCount}
product${productCount === 1 ? '' : 's'}

</span>


<p class="muted">

${esc(
business.description ||
''
)}

</p>


<button
style="background:${accent}"
data-shop="${esc(business.id)}">

View Shop

</button>


</div>

</article>

`;

}
)
.join('')

||

'<div class="msg">
No approved businesses found.
</div>';


document
.querySelectorAll(
'[data-shop]'
)
.forEach(
button => {

button.onclick =
() =>
openShop(
button.dataset.shop
);

}
);

}



/* ============================
   PRODUCT CARD
============================ */

function productCard(product){

return `

<article class="card">

${
product.image_url

?

`<img
class="productImg"
src="${esc(product.image_url)}"
alt="${esc(product.title)}"
>`

:

`<div class="productImg"></div>`

}

<div class="body">

<h3>
${esc(product.title)}
</h3>


<div class="price">

${
product.price != null

?

'MVR ' +
Number(product.price)
.toFixed(2)

:

'Contact seller'
}

</div>


<p class="muted">

${esc(
product.description ||
''
)}

</p>


<a
class="btn"
href="stores.html#product=${encodeURIComponent(product.id)}">

View Product

</a>

</div>

</article>

`;

}



/* ============================
   OPEN SHOP
============================ */

function openShop(id){

const business =
businesses.find(
b => b.id === id
);


if(!business)
return;


$('marketView')
.style.display =
'none';


$('shopView')
.style.display =
'block';


const primary =
safeColor(
business.primary_color,
'#0F766E'
);


const accent =
safeColor(
business.accent_color,
'#2563EB'
);


$('shopInfo').className =
'shopBrand';


$('shopInfo').innerHTML = `

<div
class="shopBanner"

style="

${
business.cover_url
?
`background-image:url('${esc(business.cover_url)}');`
:
''
}

background-color:${primary}22;

">

${
business.logo_url

?

`<img
class="shopBannerLogo"
src="${esc(business.logo_url)}"
alt="${esc(business.name)}"
>`

:

''
}

</div>


<div class="shopBrandBody">


<h2 style="color:${primary}">

${esc(business.name)}

</h2>


<div>

${esc(
business.category || ''
)}

${
business.location
?
' • ' +
esc(business.location)
:
''
}

</div>


<p>

${esc(
business.description || ''
)}

</p>


${
business.phone

?

`<span class="pill">

📞 ${esc(business.phone)}

</span>`

:

''
}


${
business.order_link

?

`<p>

<a
class="btn"
style="background:${accent}"
href="${esc(business.order_link)}"
target="_blank"
rel="noopener noreferrer">

Order / Contact Seller

</a>

</p>`

:

''
}


<p>

<a
class="btn secondary"
href="stores.html">

🛍️ Browse All Products

</a>

</p>


</div>

`;


const businessProducts =
products.filter(
product =>
product.business_id === business.id
);


$('shopCount')
.textContent =
businessProducts.length +
' product(s)';


$('shopProducts').innerHTML =

businessProducts
.map(productCard)
.join('')

||

'<div class="msg">
No active products available.
</div>';


history.replaceState(
null,
'',
'#shop=' +
encodeURIComponent(
business.slug ||
business.id
)
);


window.scrollTo({
top:0,
behavior:'smooth'
});

}



/* ============================
   EVENTS
============================ */

$('search').oninput =
renderBusinesses;


$('category').onchange =
renderBusinesses;


$('back').onclick =
() => {

location.href =
'businesses.html';

};



/* ============================
   START
============================ */

loadMarketplace();



/* ============================
   OPEN SHOP FROM HASH
============================ */

window.addEventListener(
'load',
() => {

const match =
location.hash.match(
/^#shop=(.*)$/
);


if(!match)
return;


const value =
decodeURIComponent(
match[1]
);


const business =
businesses.find(
b =>
b.slug === value ||
b.id === value
);


if(business)
openShop(
business.id
);

}
);

</script>

</body>
</html>
